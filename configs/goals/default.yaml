# @package _global_.goals
n_goals: 20                  # number of goals to generate

# Workspace limits for random object placement (world frame, metres)
# These should match the reachable area of the robot on the table
x_min: -0.25
x_max:  0.25
y_min: -0.25
y_max:  0.25

# Physics settling steps after each teleport
n_settle: 50

# Camera key used for goal images (must match encoder.camera_key)
camera_key: agentview_image

# Object position obs key — used to read ground-truth position after settling
# Format: <object_name>_1_pos  (set automatically from env.object_name at runtime)
object_pos_key: null          # if null, inferred as f"{env.object_name}_1_pos"
