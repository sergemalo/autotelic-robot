# @package _global_.goals
n_goals: 20
n_settle: 50
camera_key: agentview_image

# Per-joint sampling ranges (radians) for the Sawyer arm.
# These are safe starting values — tune by visually inspecting generated goals.
# Gripper joints are not listed here; they are always held open.
joint_limits:
  j1: [0.01,  0.02]   # base rotation
  j2: [0.91,  0.92]   # shoulder (negative = forward/down)
  j3: [0.01,  0.02]   # elbow rotation
  j4: [2.2,  2.21]   # elbow flex
  j5: [-1.57,  1.57]   # wrist rotation
  j6: [ 0.01,  1.57]   # wrist flex
  j7: [ 0.01,  1.57]   # wrist roll
