defaults:
  - encoder: vae  
  - reward: latent # mettre 'latent' si encoder est VAE
  - agent: sac
  - replay_buffer: default
  - env: libero_arm
  - wandb: default
  - goals: goals_arm_static
  - _self_

seed: 42
device: cuda

output_dir: ${hydra:runtime.output_dir}

training:
  total_env_steps: 50000
  checkpoint_dir: ${hydra:runtime.output_dir}/checkpoints
  checkpoint_freq: 10000      # save every N env steps
  valid:
    eval_freq: 500             # eval every N env steps
    eval_episodes: 5

eval:
  checkpoint_path: L3_latent_vae_arm_sac_step_20000.pt        # path to checkpoint to evaluate

# logging
log_level: INFO               # DEBUG, INFO, WARNING, ERROR

level: 1