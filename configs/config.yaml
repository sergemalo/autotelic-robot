defaults:
  - encoder: r3m
  - reward: privileged
  - agent: sac
  - replay_buffer: default
  - env: libero
  - wandb: default
  - _self_

seed: 42
device: cuda

checkpoint_dir: checkpoints/
checkpoint_freq: 10000        # save every N env steps

training:
  total_env_steps: 2000
  reward_offset: 200 # to verify : we want diago of table... 

eval:
  eval_freq: 500               # eval every N env steps
  eval_episodes: 10

# logging
log_level: INFO               # DEBUG, INFO, WARNING, ERROR

