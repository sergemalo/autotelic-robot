defaults:
  - encoder: r3m
  - reward: privileged
  - agent: sac
  - replay_buffer: default
  - env: libero
  - wandb: default
  - goals: default
  - _self_

seed: 42
device: cuda

checkpoint_dir: ${hydra:runtime.output_dir}/checkpoints
checkpoint_freq: 10000        # save every N env steps

total_env_steps: 100
eval_freq: 50               # eval every N env steps
eval_episodes: 1

# logging
log_level: INFO               # DEBUG, INFO, WARNING, ERROR
