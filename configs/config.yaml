defaults:
  - encoder: r3m
  - reward: privileged
  - agent: sac
  - replay_buffer: default
  - env: libero
  - wandb: default
  - goals: default
  - _self_

  
seed: 42
device: cuda

output_dir: ${hydra:runtime.output_dir}
checkpoint_dir: ${hydra:runtime.output_dir}/checkpoints
checkpoint_freq: 1000000        # save every N env steps

training:
  total_env_steps: 200000

agent:
  warmup_bias_weight: 0.7   # 0.0 = fully random, 1.0 = pure approach

eval:
  eval_freq: 10000               # eval every N env steps
  eval_episodes: 5

# logging
log_level: INFO               # DEBUG, INFO, WARNING, ERROR

