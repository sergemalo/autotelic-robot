# @package _global_.env
# Arm reaching task — no object, robot moves EEF to a target position.
name: libero_arm
camera_heights: 224
camera_widths: 224
camera_name: agentview
action_dim: 7                 # 6 DoF EEF delta + 1 gripper
episode_length: 300
success_threshold: 0.05       # metres (tighter — EEF control is more precise)
